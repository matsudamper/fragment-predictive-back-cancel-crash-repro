name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  robolectric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ 33,34,35,36, 37 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest -ProbolectricSdk=${{ matrix.sdk }}
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: robolectric-sdk${{ matrix.sdk }}-report
          path: app/build/reports/tests/testDebugUnitTest

  managed-device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [pixel6Api34, pixel6Api37]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # The emulator needs KVM
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - run: ./gradlew :app:${{ matrix.device }}DebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.device }}-report
          path: |
            app/build/reports/androidTests/managedDevice
            app/build/outputs/androidTest-results/managedDevice
